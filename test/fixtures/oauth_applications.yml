_fixture:
  model_class: Doorkeeper::Application

client:
  name: client
  uid: client-uid
  secret: <%= Digest::SHA256.hexdigest("client-secret") %>
  redirect_uri: https://client.example.com/callback
  scopes: read:profile
  confidential: true

verifier:
  name: verifier
  uid: verifier-uid
  secret: <%= Digest::SHA256.hexdigest("verifier-secret") %>
  redirect_uri: urn:ietf:wg:oauth:2.0:oob
  scopes: read:profile
  confidential: true

admin:
  name: admin
  uid: admin-uid
  secret: <%= Digest::SHA256.hexdigest("admin-secret") %>
  redirect_uri: urn:ietf:wg:oauth:2.0:oob
  scopes: "admin:users admin:apps"
  confidential: true
